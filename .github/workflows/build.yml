name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: >-
          xcodebuild
          -project ForgeSignMobile.xcodeproj
          -scheme ForgeSignMobile
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/ForgeSignMobile.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/ForgeSignMobile.xcarchive/Products/Applications/iStore.app" Payload/
          zip -qry iStore-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iStore-unsigned-ipa
          path: iStore-unsigned.ipa
          if-no-files-found: error
